CONFIG_PRINTK=y
CONFIG_SERIAL=y
CONFIG_UART_NS16550=y
CONFIG_UART_NS16550_ACCESS_WORD_ONLY=y
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_SYS_CLOCK_EXISTS=y
CONFIG_ARM_ARCH_TIMER=y

CONFIG_ROBOT_STATUS_EVERY_MESSAGES=60
CONFIG_ROBOT_CONTROL_ALIVE_LOG=n

# Keep exceptional watchdog, controller and UART diagnostics deferred rather
# than synchronously writing the virtual console while a controller/UART lock
# is held. Routine Feetech and arm-work sampling is intentionally disabled.
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_DEFAULT_LEVEL=1
CONFIG_LOG_RUNTIME_DEFAULT_LEVEL=4
CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_LOG_PROCESS_THREAD=y
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=2048
CONFIG_LOG_PRINTK=n

# Keep the interactive terminal on the AxVisor-provided virtual UART2.  UART6
# remains dedicated to the 1 Mbps Feetech bus selected by the robot-uart alias.
CONFIG_SHELL=y
CONFIG_SHELL_MINIMAL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_PROMPT_UART="zephyr:~$ "
CONFIG_KERNEL_SHELL=y
CONFIG_DEVICE_SHELL=y
